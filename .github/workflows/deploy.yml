name: Deploy to Taurus

on:
  push:
    branches:
      - Racapitalsmvp

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Run backend tests
        run: npm test
        working-directory: backend
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run frontend tests
        run: npm test
        working-directory: frontend

  deploy:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_WHATSAPP_NUMBER: ${{ secrets.VITE_WHATSAPP_NUMBER }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 180s
          envs: VITE_API_BASE_URL,VITE_WHATSAPP_NUMBER,ADMIN_USERNAME,ADMIN_PASSWORD
          script: |
            set -e
            cd /home/taurus-deploy/RaCapitals

            echo ">>> Fixing ownership"
            sudo chown -R taurus-deploy:taurus-deploy /home/taurus-deploy/RaCapitals

            echo ">>> Pulling latest code"
            git pull origin Racapitalsmvp

            echo ">>> Installing backend dependencies"
            cd backend && npm ci && cd ..

            echo ">>> Installing frontend dependencies and building"
            rm -rf frontend/node_modules
            cd frontend && npm ci 2>&1 && VITE_API_BASE_URL=$VITE_API_BASE_URL VITE_WHATSAPP_NUMBER=$VITE_WHATSAPP_NUMBER npm run build 2>&1 && cd ..

            echo ">>> Seeding admin user if not exists"
            cd backend && node seedAdmin.js && cd ..

            echo ">>> Reloading API (zero downtime)"
            pm2 reload racapitals-api

            echo ">>> Verifying API health"
            sleep 2
            curl -sf http://localhost:5000/api/health && echo " — API OK" || echo " — API health check FAILED"

            echo ">>> Deploy complete"
            pm2 status
