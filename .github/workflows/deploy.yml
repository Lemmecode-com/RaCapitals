name: Deploy to Taurus

on:
  push:
    branches:
      - Racapitalsmvp

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  deploy:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          script: |
            cd /home/taurus-deploy/RaCapitals
            git fetch origin Racapitalsmvp
            git reset --hard origin/Racapitalsmvp
            cd frontend
            npm ci || npm install
            npm run build
            mkdir -p ../backend/client-dist
            cp -r dist/* ../backend/client-dist/
            cd ../backend
            npm ci || npm install
            chmod -R 755 /home/taurus-deploy/RaCapitals
            pm2 restart racapitals-api

